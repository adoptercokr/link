<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FACE MOTION ART</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { background:#000; overflow:hidden; width:100vw; height:100vh; font-family:system-ui,sans-serif; touch-action:manipulation; }

#main-canvas { position:fixed; inset:0; width:100%; height:100%; }
#vid { display:none; }

/* ── LANDING ── */
#landing {
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#000; gap:.4rem; padding:2rem; transition:opacity .7s;
}
#landing h1 {
  font-family:'Bebas Neue',cursive;
  font-size:clamp(3rem,14vw,6.5rem);
  line-height:.85; letter-spacing:.06em; text-align:center;
  background:linear-gradient(160deg,#fff 0%,rgba(100,200,255,.6) 60%,rgba(80,120,200,.4) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
#landing .sub { font-size:.68rem; letter-spacing:.3em; color:rgba(255,255,255,.22); text-align:center; margin-top:.4rem; }
#start-btn {
  margin-top:2rem; padding:1rem clamp(2rem,8vw,3.5rem);
  font-family:'Bebas Neue',cursive; font-size:1.1rem; letter-spacing:.22em;
  color:#fff; background:transparent; border:1px solid rgba(255,255,255,.45);
  cursor:pointer; transition:all .22s; position:relative; overflow:hidden;
}
#start-btn::before { content:''; position:absolute; inset:0; background:#fff; transform:translateX(-101%); transition:transform .22s; z-index:-1; }
#start-btn:hover::before,#start-btn:active::before { transform:translateX(0); }
#start-btn:hover,#start-btn:active { color:#000; }
#start-btn:disabled { opacity:.3; pointer-events:none; }

/* ── ERROR ── */
#err {
  display:none; position:fixed; inset:0; z-index:90;
  background:#080808; flex-direction:column; align-items:center; justify-content:center;
  gap:.7rem; padding:1.5rem; text-align:center; overflow-y:auto;
}
#err.on { display:flex; }
#err h2 { font-family:'Bebas Neue',cursive; font-size:1.7rem; letter-spacing:.08em; color:#ff5555; }
.err-code { font-size:.7rem; color:rgba(255,100,100,.7); background:rgba(255,0,0,.08); border:1px solid rgba(255,0,0,.15); padding:.35rem .9rem; border-radius:4px; font-family:monospace; max-width:90vw; word-break:break-all; }
.err-card { width:100%; max-width:400px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:1rem 1.2rem; text-align:left; }
.err-card h3 { font-size:.65rem; letter-spacing:.2em; color:rgba(255,255,255,.35); margin-bottom:.6rem; }
.err-card li { font-size:.76rem; color:rgba(255,255,255,.5); line-height:2.1; list-style:none; }
.err-card li::before { content:'→ '; color:rgba(255,255,255,.2); }
.err-card li strong { color:rgba(255,255,255,.85); }
.err-btns { display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; }
.ebtn { padding:.75rem 1.4rem; font-family:'Bebas Neue',cursive; font-size:.9rem; letter-spacing:.12em; border:1px solid rgba(255,255,255,.2); color:rgba(255,255,255,.5); background:transparent; cursor:pointer; border-radius:2px; transition:all .2s; }
.ebtn:hover,.ebtn:active { border-color:#fff; color:#fff; }
.ebtn.p { border-color:rgba(255,255,255,.5); color:rgba(255,255,255,.85); }

/* ── APP UI ── */
#ui { display:none; position:fixed; inset:0; z-index:10; pointer-events:none; }
#ui.on { display:block; }

#topbar {
  position:absolute; top:0; left:0; right:0;
  padding:max(1rem, env(safe-area-inset-top,0px)) 1.3rem 1rem;
  display:flex; justify-content:space-between; align-items:flex-start;
  background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);
}
#topbar .logo { font-family:'Bebas Neue',cursive; font-size:1.1rem; letter-spacing:.18em; color:rgba(255,255,255,.45); line-height:1; }
#topbar .logo small { display:block; font-size:.38em; letter-spacing:.35em; color:rgba(255,255,255,.18); margin-top:.2em; }
#mode-info { text-align:right; }
#mode-name { font-family:'Bebas Neue',cursive; font-size:1rem; letter-spacing:.2em; color:rgba(255,255,255,.5); }
#mode-desc { font-size:.5rem; letter-spacing:.18em; color:rgba(255,255,255,.2); margin-top:.15em; }

/* Motion indicator */
#motion-ring {
  position:absolute; left:50%; top:1.2rem; transform:translateX(-50%);
  width:6px; height:6px; border-radius:50%;
  background:rgba(255,255,255,.12); transition:all .15s;
}
#motion-ring.active { background:#7dd3fc; box-shadow:0 0 8px #7dd3fc; }

/* Intensity bar */
#ibar { position:absolute; left:.9rem; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:center; gap:.35rem; }
#ibar-track { width:2px; height:70px; background:rgba(255,255,255,.07); border-radius:2px; position:relative; overflow:hidden; }
#ibar-fill { position:absolute; bottom:0; width:100%; background:linear-gradient(to top,#3b82f6,#7dd3fc,#fff); height:0%; transition:height .07s; }
#ibar-lbl { font-size:.44rem; letter-spacing:.14em; color:rgba(255,255,255,.15); writing-mode:vertical-rl; transform:rotate(180deg); font-family:'Bebas Neue',cursive; }

/* Bottom controls */
#controls {
  position:absolute; bottom:0; left:0; right:0;
  padding:.85rem .85rem calc(.85rem + env(safe-area-inset-bottom,0px));
  pointer-events:all;
  background:linear-gradient(to top,rgba(0,0,0,.72),transparent);
}
.ctrl-row { display:flex; align-items:center; justify-content:center; gap:.4rem; flex-wrap:nowrap; }
.fbtn {
  flex:1; min-width:0;
  padding:.65rem .3rem;
  font-family:'Bebas Neue',cursive; font-size:clamp(.62rem,2.6vw,.85rem);
  letter-spacing:.08em; border:1px solid rgba(255,255,255,.13);
  color:rgba(255,255,255,.28); background:transparent;
  cursor:pointer; transition:all .18s; border-radius:1px; white-space:nowrap;
}
.fbtn:active,.fbtn.on {
  color:#fff; border-color:rgba(100,200,255,.7);
  background:rgba(100,200,255,.08);
}
</style>
</head>
<body>

<video id="vid" autoplay muted playsinline webkit-playsinline></video>
<canvas id="main-canvas"></canvas>

<!-- LANDING -->
<div id="landing">
  <h1>FACE<br>MOTION<br>ART</h1>
  <p class="sub">얼굴이 물·유리·비닐로 변합니다</p>
  <button id="start-btn" onclick="startCam()">카메라 켜기 →</button>
</div>

<!-- ERROR -->
<div id="err">
  <h2 id="err-title">카메라 오류</h2>
  <div class="err-code" id="err-code"></div>
  <div class="err-card">
    <h3 id="err-guide-lbl">해결 방법</h3>
    <ul id="err-steps"></ul>
  </div>
  <div class="err-btns">
    <button class="ebtn p" onclick="retryCamera()">↩ 다시 시도</button>
    <button class="ebtn" id="copy-url-btn" onclick="copyUrl()">🔗 주소 복사</button>
  </div>
</div>

<!-- APP UI -->
<div id="ui">
  <div id="topbar">
    <div class="logo">FACE MOTION ART<small>LIVE · GENERATIVE</small></div>
    <div id="mode-info">
      <div id="mode-name">WATER</div>
      <div id="mode-desc">물속 얼굴</div>
    </div>
  </div>
  <div id="motion-ring"></div>
  <div id="ibar">
    <div id="ibar-track"><div id="ibar-fill"></div></div>
    <span id="ibar-lbl">LIVE</span>
  </div>
  <div id="controls">
    <div class="ctrl-row">
      <button class="fbtn on" onclick="setMode(0,this)">WATER</button>
      <button class="fbtn"    onclick="setMode(1,this)">PLASTIC</button>
      <button class="fbtn"    onclick="setMode(2,this)">GLASS</button>
      <button class="fbtn"    onclick="setMode(3,this)">LAVA</button>
      <button class="fbtn"    onclick="setMode(4,this)">GLITCH</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════
//  에러 처리
// ════════════════════════════════════════════
const ERR_MAP = {
  NotAllowedError: {
    title: '카메라 권한이 차단됨',
    steps: [
      '크롬 주소창 왼쪽 <strong>🔒 클릭 → 카메라 → 허용</strong>으로 변경',
      '그래도 안 되면: 크롬 주소창에 <strong>chrome://settings/content/camera</strong> 입력',
      '차단 목록에서 이 사이트 <strong>삭제</strong> 후 페이지 새로고침',
    ]
  },
  NotFoundError: {
    title: '카메라를 찾을 수 없음',
    steps: [
      'Zoom, Teams 등 <strong>카메라 쓰는 앱을 모두 종료</strong>',
      '카메라가 PC에 제대로 연결되었는지 확인',
    ]
  },
  NotReadableError: {
    title: '카메라가 이미 사용 중',
    steps: [
      '<strong>Zoom, Teams, 카메라 앱 모두 종료</strong>',
      '크롬을 완전히 닫고 다시 열기',
      '그래도 안 되면 <strong>PC 재시작</strong>',
    ]
  },
  SecurityError: {
    title: 'HTTPS 보안 오류',
    steps: [
      '주소가 <strong>https://</strong>로 시작하는지 확인',
      '카카오톡 등 인앱 브라우저가 아닌 <strong>크롬/사파리</strong>로 접속',
    ]
  },
};

function showError(e) {
  const name = e.name || 'UnknownError';
  const info = ERR_MAP[name] || {
    title: '알 수 없는 오류 (' + name + ')',
    steps: ['페이지 새로고침 후 다시 시도', '크롬 또는 사파리로 접속해 주세요']
  };
  document.getElementById('err-title').textContent = info.title;
  document.getElementById('err-code').textContent  = name + ': ' + (e.message || '');
  document.getElementById('err-steps').innerHTML   = info.steps.map(s=>`<li>${s}</li>`).join('');
  document.getElementById('landing').style.display = 'none';
  document.getElementById('err').classList.add('on');
  console.error('[CAM ERROR]', name, e.message, e);
}
function retryCamera() {
  document.getElementById('err').classList.remove('on');
  document.getElementById('landing').style.cssText = 'display:flex;opacity:1';
  document.getElementById('start-btn').disabled = false;
  document.getElementById('start-btn').textContent = '카메라 켜기 →';
}
function copyUrl() {
  navigator.clipboard.writeText(location.href).then(()=>alert('주소 복사됨!\nSafari / Chrome 주소창에 붙여넣기 하세요.')).catch(()=>prompt('주소를 복사해서 Safari/Chrome에 붙여넣으세요:', location.href));
}

// ════════════════════════════════════════════
//  캔버스 & 비디오 셋업
// ════════════════════════════════════════════
const canvas = document.getElementById('main-canvas');
const ctx    = canvas.getContext('2d');
const vid    = document.getElementById('vid');

// 오프스크린 — 비디오 프레임 읽기용
const offCv = document.createElement('canvas');
const offCx = offCv.getContext('2d', {willReadFrequently:true});

// 모션 감지용 소형 캔버스
const motCv = document.createElement('canvas');
const motCx = motCv.getContext('2d', {willReadFrequently:true});
const MW=80, MH=60;
motCv.width=MW; motCv.height=MH;

let W, H, VW, VH;
let mode = 0, T = 0;
let prevMotPx = null;
let motionLevel = 0;      // 0~1 전체 모션량
let motionMap   = null;   // MW×MH Float32 — 픽셀별 모션 강도
let running = false;

// 리플 시스템 (물/비닐)
let ripBuf1, ripBuf2;     // Float32Array — wave height field
let ripW, ripH;

// 글리치 라인
let glitchLines = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initRipple();
}
resize();
window.addEventListener('resize', resize);

// ════════════════════════════════════════════
//  카메라 시작
// ════════════════════════════════════════════
async function startCam() {
  const btn = document.getElementById('start-btn');
  btn.textContent = '연결 중...'; btn.disabled = true;

  if (!navigator.mediaDevices?.getUserMedia) {
    showError({name:'SecurityError', message:'이 브라우저는 카메라를 지원하지 않아요. 크롬/사파리를 사용해 주세요.'});
    return;
  }

  // 여러 조합을 순서대로 시도
  const tries = [
    {video:{facingMode:'user', width:{ideal:1280}, height:{ideal:720}}},
    {video:{facingMode:'user', width:{ideal:640},  height:{ideal:480}}},
    {video:{facingMode:'user'}},
    {video:true},
  ];

  let stream = null, lastErr = null;
  for (const c of tries) {
    try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
    catch(e) {
      lastErr = e;
      if (e.name==='NotAllowedError'||e.name==='SecurityError') break;
    }
  }
  if (!stream) { showError(lastErr); return; }

  vid.srcObject = stream;
  try { await vid.play(); } catch(e) { showError(e); return; }

  VW = vid.videoWidth  || 640;
  VH = vid.videoHeight || 480;
  offCv.width=VW; offCv.height=VH;

  // 랜딩 페이드 아웃
  const landing = document.getElementById('landing');
  landing.style.opacity='0';
  setTimeout(()=>landing.style.display='none', 700);
  document.getElementById('ui').classList.add('on');

  if (!running) { running=true; requestAnimationFrame(loop); }
}

// ════════════════════════════════════════════
//  모션 감지
// ════════════════════════════════════════════
function detectMotion() {
  if (vid.readyState < 2) return;

  // 미러 반전해서 캡처
  motCx.save();
  motCx.translate(MW, 0); motCx.scale(-1, 1);
  motCx.drawImage(vid, 0, 0, MW, MH);
  motCx.restore();

  const cur = motCx.getImageData(0, 0, MW, MH).data;
  if (!prevMotPx || !motionMap) {
    prevMotPx = new Uint8ClampedArray(cur);
    motionMap = new Float32Array(MW * MH);
    return;
  }

  let total = 0;
  for (let i = 0; i < MW * MH; i++) {
    const p = i * 4;
    const d = (Math.abs(cur[p]-prevMotPx[p]) + Math.abs(cur[p+1]-prevMotPx[p+1]) + Math.abs(cur[p+2]-prevMotPx[p+2])) / (255*3);
    motionMap[i] = d;
    total += d;
  }
  prevMotPx.set(cur);

  motionLevel = Math.min(1, total / (MW * MH * 0.08));
  document.getElementById('ibar-fill').style.height = (motionLevel*100)+'%';
  const ring = document.getElementById('motion-ring');
  ring.classList.toggle('active', motionLevel > 0.02);
}

// ════════════════════════════════════════════
//  리플 버퍼 초기화
// ════════════════════════════════════════════
function initRipple() {
  ripW = Math.floor(W / 2);
  ripH = Math.floor(H / 2);
  ripBuf1 = new Float32Array(ripW * ripH);
  ripBuf2 = new Float32Array(ripW * ripH);
}

function updateRipple() {
  // 모션이 있는 곳에 파동 소스 추가
  if (motionMap && motionLevel > 0.01) {
    for (let my = 0; my < MH; my++) {
      for (let mx2 = 0; mx2 < MW; mx2++) {
        const m = motionMap[my * MW + mx2];
        if (m > 0.04) {
          // 모션 좌표 → 리플 버퍼 좌표
          const rx = Math.floor((mx2 / MW) * ripW);
          const ry = Math.floor((my / MH) * ripH);
          const idx = ry * ripW + rx;
          if (idx >= 0 && idx < ripBuf1.length) {
            ripBuf1[idx] += m * 180;
          }
        }
      }
    }
  }

  // 파동 전파 (2D wave equation)
  const damp = 0.97;
  for (let y = 1; y < ripH-1; y++) {
    for (let x = 1; x < ripW-1; x++) {
      const i = y*ripW + x;
      ripBuf2[i] = (
        (ripBuf1[i-1] + ripBuf1[i+1] + ripBuf1[i-ripW] + ripBuf1[i+ripW]) / 2
        - ripBuf2[i]
      ) * damp;
    }
  }
  // 버퍼 스왑
  const tmp = ripBuf1; ripBuf1 = ripBuf2; ripBuf2 = tmp;
}

// ════════════════════════════════════════════
//  오프스크린에 비디오 그리기
// ════════════════════════════════════════════
function captureVideo() {
  if (vid.readyState < 2) return false;
  // 미러 반전
  offCx.save();
  offCx.translate(VW, 0); offCx.scale(-1, 1);
  offCx.drawImage(vid, 0, 0, VW, VH);
  offCx.restore();
  return true;
}

// 화면에 비디오 + 왜곡 그리기 — 픽셀 단위 displacement
function drawDistorted(displaceX, displaceY, extraFn) {
  if (!captureVideo()) return;

  const imgData = offCx.getImageData(0, 0, VW, VH);
  const out     = ctx.createImageData(W, H);
  const src     = imgData.data;
  const dst     = out.data;

  const scaleX = VW / W;
  const scaleY = VH / H;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      // 리플 버퍼에서 displacement 계산
      const rx = Math.min(ripW-1, Math.floor(x * ripW / W));
      const ry = Math.min(ripH-1, Math.floor(y * ripH / H));
      const rIdx = ry * ripW + rx;
      const rippleVal = ripBuf1[rIdx] || 0;

      const dx = displaceX(x, y, rippleVal);
      const dy = displaceY(x, y, rippleVal);

      let sx = Math.round((x + dx) * scaleX);
      let sy = Math.round((y + dy) * scaleY);
      sx = Math.max(0, Math.min(VW-1, sx));
      sy = Math.max(0, Math.min(VH-1, sy));

      const si = (sy * VW + sx) * 4;
      const di = (y  * W  + x)  * 4;

      dst[di]   = src[si];
      dst[di+1] = src[si+1];
      dst[di+2] = src[si+2];
      dst[di+3] = src[si+3];

      if (extraFn) extraFn(dst, di, x, y, rippleVal);
    }
  }
  ctx.putImageData(out, 0, 0);
}

// ════════════════════════════════════════════
//  MODE 0 — WATER (물속 얼굴)
// ════════════════════════════════════════════
function drawWater() {
  const t = T;
  drawDistorted(
    (x, y, rv) => {
      const wave1 = Math.sin(x * 0.025 + t * 0.04) * 8;
      const wave2 = Math.sin(y * 0.018 + t * 0.03) * 5;
      return rv * 0.4 + wave1 + wave2;
    },
    (x, y, rv) => {
      const wave1 = Math.cos(y * 0.022 + t * 0.035) * 8;
      const wave2 = Math.cos(x * 0.016 + t * 0.028) * 4;
      return rv * 0.4 + wave1 + wave2;
    },
    // 색 오버레이 — 파란 물빛 tint
    (dst, di, x, y, rv) => {
      const depth = 0.25 + Math.abs(rv) * 0.003;
      dst[di]   = Math.min(255, dst[di]   * (1 - depth * 0.4));   // R 줄임
      dst[di+1] = Math.min(255, dst[di+1] * (1 - depth * 0.15));  // G 약간
      dst[di+2] = Math.min(255, dst[di+2] * 1.2 + depth * 30);    // B 강화
    }
  );

  // 물 표면 하이라이트 오버레이
  const t2 = T * 0.03;
  ctx.save();
  for (let i = 0; i < 6; i++) {
    const lx = (Math.sin(t2 * 1.1 + i * 1.3) * 0.4 + 0.5) * W;
    const ly = (Math.cos(t2 * 0.9 + i * 0.8) * 0.3 + 0.3) * H;
    const gr = ctx.createRadialGradient(lx, ly, 0, lx, ly, W * 0.2);
    gr.addColorStop(0, `rgba(150,220,255,${0.03 + motionLevel*0.06})`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(lx,ly,W*0.2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ════════════════════════════════════════════
//  MODE 1 — PLASTIC (비닐/랩으로 싸인 얼굴)
// ════════════════════════════════════════════
function drawPlastic() {
  const t = T;
  drawDistorted(
    (x, y, rv) => {
      // 비닐 주름 — 날카롭고 불규칙한 왜곡
      const crinkle = Math.sin(x*0.06 + t*0.02)*3 + Math.sin(x*0.13+y*0.07+t*0.015)*4;
      return rv * 0.6 + crinkle;
    },
    (x, y, rv) => {
      const crinkle = Math.cos(y*0.05 + t*0.018)*3 + Math.cos(y*0.11+x*0.06+t*0.013)*4;
      return rv * 0.6 + crinkle;
    },
    // 비닐 느낌 — 약간 탁하고 반투명한 하이라이트
    (dst, di, x, y, rv) => {
      const shine = Math.abs(Math.sin(x*0.04+T*0.015)*Math.cos(y*0.035+T*0.012));
      const highlight = shine * 60 * (1 + Math.abs(rv)*0.005);
      dst[di]   = Math.min(255, dst[di]   * 0.85 + highlight);
      dst[di+1] = Math.min(255, dst[di+1] * 0.9  + highlight);
      dst[di+2] = Math.min(255, dst[di+2] * 0.95 + highlight * 1.1);
    }
  );

  // 비닐 광택 레이어
  const t3 = T * 0.018;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 4; i++) {
    const ang = t3 + i * Math.PI / 2;
    const lx = W/2 + Math.cos(ang)*W*0.25;
    const ly = H/2 + Math.sin(ang)*H*0.2;
    const gr = ctx.createRadialGradient(lx,ly,0,lx,ly,W*0.3);
    gr.addColorStop(0, `rgba(255,255,255,${0.04+motionLevel*0.05})`);
    gr.addColorStop(0.4, `rgba(200,220,255,0.02)`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(lx,ly,W*0.3,0,Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

// ════════════════════════════════════════════
//  MODE 2 — GLASS (유리/프리즘)
// ════════════════════════════════════════════
function drawGlass() {
  if (!captureVideo()) return;
  const imgData = offCx.getImageData(0, 0, VW, VH);
  const src = imgData.data;
  const out = ctx.createImageData(W, H);
  const dst = out.data;
  const scX = VW/W, scY = VH/H;

  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    const rx = Math.min(ripW-1, Math.floor(x*ripW/W));
    const ry = Math.min(ripH-1, Math.floor(y*ripH/H));
    const rv = ripBuf1[ry*ripW+rx]||0;

    const t = T;
    // RGB 채널을 각각 다른 방향으로 굴절 (프리즘 효과)
    const baseWave = Math.sin(x*0.02+t*0.025)*6 + rv*0.3;
    const offsetR = baseWave + Math.sin(y*0.015+t*0.02)*4;
    const offsetG = baseWave * 0.7 + Math.cos(x*0.018+t*0.022)*5;
    const offsetB = baseWave * 1.3 + Math.sin((x+y)*0.012+t*0.018)*7;

    function sampleChannel(dx, dy, ch) {
      let sx = Math.max(0,Math.min(VW-1, Math.round((x+dx)*scX)));
      let sy = Math.max(0,Math.min(VH-1, Math.round((y+dy)*scY)));
      return src[(sy*VW+sx)*4+ch];
    }

    const di = (y*W+x)*4;
    dst[di]   = sampleChannel(offsetR, offsetR*0.5, 0);
    dst[di+1] = sampleChannel(offsetG*0.3, offsetG, 1);
    dst[di+2] = sampleChannel(-offsetB*0.4, offsetB*0.8, 2);
    dst[di+3] = 255;

    // 유리 내부 반사
    const facet = Math.abs(Math.sin(x*0.035+t*0.01)*Math.sin(y*0.03+t*0.008));
    if (facet > 0.85) {
      dst[di]   = Math.min(255, dst[di]   + 40);
      dst[di+1] = Math.min(255, dst[di+1] + 45);
      dst[di+2] = Math.min(255, dst[di+2] + 60);
    }
  }
  ctx.putImageData(out, 0, 0);
}

// ════════════════════════════════════════════
//  MODE 3 — LAVA (용암/열화상)
// ════════════════════════════════════════════
function drawLava() {
  const t = T;
  drawDistorted(
    (x, y, rv) => Math.sin(x*0.03+t*0.05)*10 + rv*0.5,
    (x, y, rv) => Math.cos(y*0.025+t*0.04)*10 + rv*0.5,
    (dst, di, x, y, rv) => {
      // 열화상 컬러 매핑 — 밝기로 온도 계산
      const bright = (dst[di]*0.299 + dst[di+1]*0.587 + dst[di+2]*0.114) / 255;
      const heat   = Math.min(1, bright + Math.abs(rv)*0.005 + motionLevel*0.3);
      // heat → 흑→빨→주→노→흰
      if (heat < 0.25)      { dst[di]=Math.round(heat*4*180); dst[di+1]=0; dst[di+2]=0; }
      else if (heat < 0.5)  { dst[di]=180+Math.round((heat-0.25)*4*75); dst[di+1]=Math.round((heat-0.25)*4*80); dst[di+2]=0; }
      else if (heat < 0.75) { dst[di]=255; dst[di+1]=80+Math.round((heat-0.5)*4*175); dst[di+2]=0; }
      else                   { dst[di]=255; dst[di+1]=255; dst[di+2]=Math.round((heat-0.75)*4*255); }
      dst[di+3]=255;
    }
  );
}

// ════════════════════════════════════════════
//  MODE 4 — GLITCH (디지털 왜곡)
// ════════════════════════════════════════════
function drawGlitchMode() {
  // 기본 영상
  if (!captureVideo()) return;
  ctx.drawImage(offCv, 0, 0, W, H);

  // 글리치 라인 생성
  if (motionLevel > 0.02 && Math.random() < 0.35 + motionLevel*0.5) {
    const y = Math.random() * H;
    const h = 2 + Math.random() * (20 + motionLevel * 60);
    glitchLines.push({
      y, h,
      shift: (Math.random()-.5) * (40 + motionLevel*100),
      life: 1, decay: 0.06 + Math.random()*0.12,
      hue: Math.random() < 0.5 ? 0 : Math.random() < 0.5 ? 120 : 220,
    });
  }
  // 항상 일정량 글리치 유지
  if (Math.random() < 0.1) {
    glitchLines.push({ y:Math.random()*H, h:1+Math.random()*8, shift:(Math.random()-.5)*15, life:1, decay:0.15, hue:220 });
  }

  glitchLines = glitchLines.filter(l => { l.life -= l.decay; return l.life > 0; });

  // 글리치 렌더
  const imgData = offCx.getImageData(0, 0, VW, VH);
  glitchLines.forEach(l => {
    const sy = Math.floor(l.y * VH/H);
    const sh = Math.max(1, Math.floor(l.h * VH/H));
    if (sy < 0 || sy+sh > VH) return;
    const sliceData = offCx.getImageData(0, sy, VW, sh);

    ctx.save();
    ctx.globalAlpha = l.life * 0.85;
    // RGB 분리
    ctx.globalCompositeOperation = 'screen';
    const tempCv = document.createElement('canvas');
    tempCv.width=VW; tempCv.height=sh;
    const tempCx=tempCv.getContext('2d');
    tempCx.putImageData(sliceData, 0, 0);
    const dy = l.y;
    ctx.drawImage(tempCv, l.shift,       dy, W, l.h);
    ctx.globalAlpha = l.life * 0.4;
    ctx.drawImage(tempCv, l.shift+8,     dy, W, l.h);
    ctx.drawImage(tempCv, l.shift-5,     dy, W, l.h);
    ctx.restore();
  });

  // 스캔라인
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let y=0;y<H;y+=2) { ctx.fillStyle='#000'; ctx.fillRect(0,y,W,1); }
  ctx.restore();

  // 픽셀 블록 왜곡 (모션 많을 때)
  if (motionLevel > 0.1 && Math.random() < 0.5) {
    const bx = Math.floor(Math.random()*W*0.8);
    const by = Math.floor(Math.random()*H*0.8);
    const bw = 20 + Math.floor(Math.random()*80);
    const bh = 5  + Math.floor(Math.random()*30);
    const shift = (Math.random()-.5) * 30 * motionLevel;
    try {
      const bd = ctx.getImageData(bx, by, bw, bh);
      ctx.putImageData(bd, bx+shift, by);
    } catch(e){}
  }
}

// ════════════════════════════════════════════
//  모드 전환
// ════════════════════════════════════════════
const MODE_INFO = [
  {name:'WATER',   desc:'물속 얼굴'},
  {name:'PLASTIC', desc:'비닐에 싸인 얼굴'},
  {name:'GLASS',   desc:'유리·프리즘 굴절'},
  {name:'LAVA',    desc:'열화상 효과'},
  {name:'GLITCH',  desc:'디지털 왜곡'},
];
function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('mode-name').textContent = MODE_INFO[m].name;
  document.getElementById('mode-desc').textContent = MODE_INFO[m].desc;
  glitchLines = [];
  initRipple();
  ctx.clearRect(0,0,W,H);
}

// ════════════════════════════════════════════
//  메인 루프
// ════════════════════════════════════════════
const DRAW = [drawWater, drawPlastic, drawGlass, drawLava, drawGlitchMode];

function loop() {
  detectMotion();
  updateRipple();

  DRAW[mode]();
  T++;

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
