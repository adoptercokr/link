<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LAVA FACE v5</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { background:#000; overflow:hidden; width:100vw; height:100vh; touch-action:manipulation; }

/* 캔버스 레이어 순서: 잔상 → 현재 프레임 → FX */
#c-trail { position:fixed; inset:0; width:100%; height:100%; }  /* 잔상 누적 */
#c-live  { position:fixed; inset:0; width:100%; height:100%; }  /* 현재 프레임 */
#vid { display:none; }

/* LANDING */
#landing {
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#000; padding:2rem; transition:opacity .8s;
}
#landing h1 {
  font-family:'Bebas Neue',cursive;
  font-size:clamp(3rem,14vw,6.5rem);
  line-height:.82; letter-spacing:.06em; text-align:center;
  background:linear-gradient(160deg,#ff6a00,#ff4500,#ff0000);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  animation:flicker 3s ease-in-out infinite;
}
@keyframes flicker { 0%,100%{opacity:.8}50%{opacity:1}75%{opacity:.9} }
#landing .sub { font-size:.65rem; letter-spacing:.3em; color:rgba(255,100,30,.3); text-align:center; margin-top:.6rem; }
#landing .ver { font-size:.48rem; letter-spacing:.22em; color:rgba(255,255,255,.1); margin-top:.25rem; text-align:center; }
#start-btn {
  margin-top:2rem; padding:1rem clamp(2rem,8vw,3.5rem);
  font-family:'Bebas Neue',cursive; font-size:1.1rem; letter-spacing:.22em;
  color:#ff6a00; background:transparent; border:1px solid rgba(255,106,0,.5);
  cursor:pointer; position:relative; overflow:hidden; transition:color .22s;
}
#start-btn::before { content:''; position:absolute; inset:0; background:#ff4500; transform:translateX(-101%); transition:transform .22s; z-index:-1; }
#start-btn:hover::before,#start-btn:active::before { transform:translateX(0); }
#start-btn:hover,#start-btn:active { color:#fff; }
#start-btn:disabled { opacity:.3; pointer-events:none; }

/* ERROR */
#err { display:none; position:fixed; inset:0; z-index:90; background:#080808; flex-direction:column; align-items:center; justify-content:center; gap:.7rem; padding:1.5rem; text-align:center; overflow-y:auto; }
#err.on { display:flex; }
#err h2 { font-family:'Bebas Neue',cursive; font-size:1.6rem; color:#ff5555; letter-spacing:.08em; }
.ec { font-size:.68rem; color:rgba(255,90,90,.7); background:rgba(255,0,0,.07); border:1px solid rgba(255,0,0,.14); padding:.3rem .8rem; border-radius:4px; font-family:monospace; max-width:90vw; word-break:break-all; }
.ecard { width:100%; max-width:380px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:.9rem 1.1rem; text-align:left; }
.ecard h3 { font-size:.62rem; letter-spacing:.18em; color:rgba(255,255,255,.3); margin-bottom:.5rem; }
.ecard li { font-size:.73rem; color:rgba(255,255,255,.48); line-height:2.1; list-style:none; }
.ecard li::before { content:'→ '; color:rgba(255,255,255,.18); }
.ecard li strong { color:rgba(255,255,255,.82); }
.ebtns { display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; }
.ebtn { padding:.7rem 1.3rem; font-family:'Bebas Neue',cursive; font-size:.88rem; letter-spacing:.12em; border:1px solid rgba(255,255,255,.18); color:rgba(255,255,255,.45); background:transparent; cursor:pointer; border-radius:2px; transition:all .2s; }
.ebtn:hover,.ebtn:active { border-color:#fff; color:#fff; }
.ebtn.p { border-color:rgba(255,100,0,.6); color:rgba(255,150,50,.9); }

/* UI */
#ui { display:none; position:fixed; inset:0; z-index:20; pointer-events:none; }
#ui.on { display:block; }
#topbar {
  position:absolute; top:0; left:0; right:0;
  padding:max(1rem,env(safe-area-inset-top,0px)) 1.3rem .8rem;
  display:flex; justify-content:space-between; align-items:flex-start;
  background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent);
}
.logo { font-family:'Bebas Neue',cursive; font-size:.95rem; letter-spacing:.18em; color:rgba(255,100,30,.5); }
.logo small { display:block; font-size:.36em; letter-spacing:.28em; color:rgba(255,255,255,.15); margin-top:.16em; }
#right-info { text-align:right; }
#mname { font-family:'Bebas Neue',cursive; font-size:.88rem; letter-spacing:.2em; color:rgba(255,100,30,.55); }
#msub  { font-size:.44rem; letter-spacing:.15em; color:rgba(255,255,255,.18); margin-top:.1em; }

/* 잔상 강도 슬라이더 */
#trail-ctrl {
  position:absolute; bottom:0; left:0; right:0;
  padding:.8rem 1.2rem calc(.8rem + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,rgba(0,0,0,.6),transparent);
  pointer-events:all;
  display:flex; align-items:center; justify-content:center; gap:.8rem;
}
#trail-ctrl label { font-family:'Bebas Neue',cursive; font-size:.7rem; letter-spacing:.15em; color:rgba(255,100,30,.5); white-space:nowrap; }
#trail-slider {
  -webkit-appearance:none; appearance:none;
  width:min(220px,60vw); height:2px;
  background:rgba(255,100,0,.2); border-radius:2px; outline:none; cursor:pointer;
}
#trail-slider::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#ff4500; cursor:pointer; box-shadow:0 0 8px rgba(255,69,0,.6); }
#trail-slider::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#ff4500; cursor:pointer; border:none; }
#trail-val { font-family:'Bebas Neue',cursive; font-size:.7rem; letter-spacing:.1em; color:rgba(255,100,30,.4); min-width:2rem; text-align:left; }

/* motion dot */
#mdot { position:absolute; top:max(1rem,env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:rgba(255,100,0,.15); transition:all .15s; }
#mdot.on { background:#ff6a00; box-shadow:0 0 10px rgba(255,106,0,.7); }
</style>
</head>
<body>

<video id="vid" autoplay muted playsinline webkit-playsinline></video>
<!-- 잔상 캔버스 (뒤) -->
<canvas id="c-trail"></canvas>
<!-- 현재 프레임 캔버스 (앞) -->
<canvas id="c-live"></canvas>

<!-- LANDING -->
<div id="landing">
  <h1>LAVA<br>FACE</h1>
  <p class="sub">열화상 아트</p>
  <p class="ver">v5 · FACE MOTION ART</p>
  <button id="start-btn" onclick="startCam()">카메라 켜기 →</button>
</div>

<!-- ERROR -->
<div id="err">
  <h2 id="et">카메라 오류</h2>
  <div class="ec" id="ec"></div>
  <div class="ecard"><h3>해결 방법</h3><ul id="es"></ul></div>
  <div class="ebtns">
    <button class="ebtn p" onclick="retry()">↩ 다시 시도</button>
    <button class="ebtn" onclick="copyUrl()">🔗 주소 복사</button>
  </div>
</div>

<!-- UI -->
<div id="ui">
  <div id="topbar">
    <div class="logo">LAVA FACE<small>v5 · LIVE</small></div>
    <div id="right-info"><div id="mname">LAVA</div><div id="msub">열화상 잔상 아트</div></div>
  </div>
  <div id="mdot"></div>
  <div id="trail-ctrl">
    <label>잔상</label>
    <input type="range" id="trail-slider" min="1" max="98" value="88" oninput="updateTrail(this.value)">
    <span id="trail-val">88</span>
  </div>
</div>

<script>
// ══ 에러 ══════════════════════════════════════════════
const EM={
  NotAllowedError:  {t:'카메라 권한 차단됨',    s:['주소창 왼쪽 <strong>🔒 → 카메라 → 허용</strong>','크롬: 주소창에 <strong>chrome://settings/content/camera</strong> 입력 후 차단 목록에서 삭제','페이지 새로고침 후 다시 시도']},
  NotFoundError:    {t:'카메라를 찾을 수 없음',  s:['Zoom·Teams 등 <strong>카메라 쓰는 앱 모두 종료</strong>','카메라 연결 상태 확인']},
  NotReadableError: {t:'카메라가 이미 사용 중',  s:['<strong>다른 앱 모두 종료</strong> 후 크롬 재시작','그래도 안 되면 PC 재시작']},
  SecurityError:    {t:'HTTPS 필요',            s:['주소가 <strong>https://</strong>로 시작하는지 확인','카카오톡 인앱브라우저 말고 <strong>크롬/사파리</strong>로 접속']},
};
function showErr(e){
  const n=e.name||'Error', inf=EM[n]||{t:'오류: '+n, s:['새로고침 후 재시도','크롬/사파리로 접속']};
  document.getElementById('et').textContent=inf.t;
  document.getElementById('ec').textContent=n+': '+(e.message||'');
  document.getElementById('es').innerHTML=inf.s.map(s=>`<li>${s}</li>`).join('');
  document.getElementById('landing').style.display='none';
  document.getElementById('err').classList.add('on');
  console.error('[LAVA FACE v5]',n,e.message,e);
}
function retry(){document.getElementById('err').classList.remove('on');const l=document.getElementById('landing');l.style.cssText='display:flex;opacity:1';document.getElementById('start-btn').disabled=false;document.getElementById('start-btn').textContent='카메라 켜기 →';}
function copyUrl(){navigator.clipboard.writeText(location.href).then(()=>alert('복사됨! Safari/Chrome에 붙여넣기 하세요.')).catch(()=>prompt('복사 후 붙여넣기:',location.href));}

// ══ 캔버스 셋업 ═══════════════════════════════════════
const trailCv  = document.getElementById('c-trail');
const trailCtx = trailCv.getContext('2d');
const liveCv   = document.getElementById('c-live');
const liveCtx  = liveCv.getContext('2d');
const vid      = document.getElementById('vid');

// 비디오 → 픽셀 읽기 (작은 사이즈로 성능 최적화)
const capCv = document.createElement('canvas');
const capCx = capCv.getContext('2d', {willReadFrequently:true});

// 모션 감지용 (더 작게)
const motCv = document.createElement('canvas');
const motCx = motCv.getContext('2d', {willReadFrequently:true});
motCv.width=80; motCv.height=60;

let W, H, VW=640, VH=480;
let T=0, running=false;
let prevMotPx=null, motionLevel=0;

// 잔상 강도 (0~1) — 슬라이더로 조절
let trailAlpha = 1 - 88/100; // 초기값 0.12 (거의 안 지워짐 = 잔상 길게)

function updateTrail(v){
  // 슬라이더 값이 클수록 잔상 더 오래 남음
  trailAlpha = 1 - v/100;  // v=88 → 0.12씩 지워짐
  document.getElementById('trail-val').textContent=v;
}

function resize(){
  W=trailCv.width=liveCv.width=window.innerWidth;
  H=trailCv.height=liveCv.height=window.innerHeight;
  // 캡처 캔버스는 성능을 위해 절반 해상도
  capCv.width=Math.floor(W/2); capCv.height=Math.floor(H/2);
  trailCtx.fillStyle='#000'; trailCtx.fillRect(0,0,W,H);
}
resize(); window.addEventListener('resize',resize);

// ══ 카메라 ════════════════════════════════════════════
async function startCam(){
  const btn=document.getElementById('start-btn');
  btn.textContent='연결 중...'; btn.disabled=true;
  if(!navigator.mediaDevices?.getUserMedia){showErr({name:'SecurityError',message:'카메라 API 미지원 — 크롬/사파리를 사용해 주세요.'});return;}

  const tries=[
    {video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}},
    {video:{facingMode:'user',width:{ideal:640}, height:{ideal:480}}},
    {video:{facingMode:'user'}},
    {video:true},
  ];
  let stream=null, lastErr=null;
  for(const cfg of tries){
    try{stream=await navigator.mediaDevices.getUserMedia(cfg);break;}
    catch(e){lastErr=e;if(e.name==='NotAllowedError'||e.name==='SecurityError'||e.name==='NotFoundError')break;}
  }
  if(!stream){showErr(lastErr);return;}

  vid.srcObject=stream;
  try{await vid.play();}catch(e){showErr(e);return;}

  VW=vid.videoWidth||640; VH=vid.videoHeight||480;

  const land=document.getElementById('landing');
  land.style.opacity='0'; setTimeout(()=>land.style.display='none',700);
  document.getElementById('ui').classList.add('on');
  if(!running){running=true;requestAnimationFrame(loop);}
}

// ══ 모션 감지 ═════════════════════════════════════════
function detectMotion(){
  if(vid.readyState<2)return;
  motCx.save(); motCx.translate(80,0); motCx.scale(-1,1);
  motCx.drawImage(vid,0,0,80,60); motCx.restore();
  const cur=motCx.getImageData(0,0,80,60).data;
  if(!prevMotPx){prevMotPx=new Uint8ClampedArray(cur);return;}
  let total=0;
  for(let i=0;i<80*60;i++){const p=i*4;total+=Math.abs(cur[p]-prevMotPx[p])+Math.abs(cur[p+1]-prevMotPx[p+1])+Math.abs(cur[p+2]-prevMotPx[p+2]);}
  prevMotPx.set(cur);
  motionLevel=Math.min(1,total/(80*60*255*0.25));
  document.getElementById('mdot').classList.toggle('on',motionLevel>0.01);
}

// ══ LAVA 열화상 렌더 ══════════════════════════════════
// 핵심: 절반 해상도 캡처 → lava 변환 → 2배 업스케일
// 이렇게 하면 JS 연산이 1/4로 줄어서 PC에서도 빠름

function renderLava(){
  if(vid.readyState<2)return;

  const cW=capCv.width, cH=capCv.height;
  const t=T;

  // 비디오 → 캡처 캔버스 (미러 + 절반 해상도)
  capCx.save(); capCx.translate(cW,0); capCx.scale(-1,1);
  capCx.drawImage(vid,0,0,cW,cH); capCx.restore();

  const src=capCx.getImageData(0,0,cW,cH).data;
  const out=capCx.createImageData(cW,cH);
  const dst=out.data;

  for(let y=0;y<cH;y++){
    for(let x=0;x<cW;x++){
      // 물결 왜곡 (소규모)
      const wx=x+Math.sin(y*0.05+t*0.04)*5+Math.sin(x*0.04+t*0.03)*3;
      const wy=y+Math.cos(x*0.045+t*0.035)*5+Math.cos(y*0.03+t*0.025)*3;
      const sx=Math.max(0,Math.min(cW-1,Math.round(wx)));
      const sy=Math.max(0,Math.min(cH-1,Math.round(wy)));
      const si=(sy*cW+sx)*4;
      const di=(y*cW+x)*4;

      // 밝기 계산
      const bright=(src[si]*0.299+src[si+1]*0.587+src[si+2]*0.114)/255;
      // 모션에 따라 열 추가
      const heat=Math.min(1, bright + motionLevel*0.35);

      // 열화상 컬러 매핑: 흑→빨→주황→노랑→흰
      if(heat<0.25){
        dst[di]  =Math.round(heat*4*200);
        dst[di+1]=0;
        dst[di+2]=Math.round(heat*4*40);
      } else if(heat<0.5){
        const p=(heat-0.25)*4;
        dst[di]  =200+Math.round(p*55);
        dst[di+1]=Math.round(p*100);
        dst[di+2]=Math.round(10-p*10);
      } else if(heat<0.75){
        const p=(heat-0.5)*4;
        dst[di]  =255;
        dst[di+1]=100+Math.round(p*155);
        dst[di+2]=0;
      } else {
        const p=(heat-0.75)*4;
        dst[di]  =255;
        dst[di+1]=255;
        dst[di+2]=Math.round(p*255);
      }
      dst[di+3]=255;
    }
  }

  capCx.putImageData(out,0,0);

  // live 캔버스에 2배 업스케일로 그리기
  liveCtx.clearRect(0,0,W,H);
  liveCtx.imageSmoothingEnabled=true;
  liveCtx.imageSmoothingQuality='medium';
  liveCtx.drawImage(capCv,0,0,W,H);
}

// ══ 잔상 시스템 ═══════════════════════════════════════
// trail 캔버스를 거의 안 지움 → 이전 프레임이 겹쳐서 잔상 생성
// live 캔버스를 trail 위에 screen 블렌딩으로 합성

function updateTrailCanvas(){
  // 잔상 캔버스를 trailAlpha만큼만 어둡게 (아주 조금씩 지움)
  trailCtx.fillStyle=`rgba(0,0,0,${trailAlpha})`;
  trailCtx.fillRect(0,0,W,H);

  // 현재 live 프레임을 잔상 캔버스에 누적
  // screen 블렌딩 → 밝은 부분(용암색)이 겹치면서 빛나는 효과
  trailCtx.save();
  trailCtx.globalCompositeOperation='screen';
  trailCtx.globalAlpha=0.85;
  trailCtx.drawImage(liveCv,0,0);
  trailCtx.restore();
}

// ══ 루프 ══════════════════════════════════════════════
function loop(){
  detectMotion();
  renderLava();
  updateTrailCanvas();
  T++;
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
