<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ART FACE — NEON</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { background:#000; overflow:hidden; width:100vw; height:100vh; }
canvas { position:fixed; inset:0; width:100%; height:100%; }
video  { display:none; }

/* LANDING */
#landing {
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#000; gap:.5rem; padding:2rem; transition:opacity .7s;
}
#landing h1 {
  font-family:'Bebas Neue',cursive;
  font-size:clamp(4rem,16vw,8rem);
  line-height:.82; letter-spacing:.06em; text-align:center;
  background:linear-gradient(135deg,#fff 0%,#aaa 55%,#555 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
#landing .sub { font-size:.65rem; letter-spacing:.3em; color:rgba(255,255,255,.2); margin-top:.5rem; }
#start-btn {
  margin-top:2rem; padding:1rem clamp(2rem,8vw,3.5rem);
  font-family:'Bebas Neue',cursive; font-size:1.1rem; letter-spacing:.22em;
  color:rgba(255,255,255,.7); background:transparent; border:1px solid rgba(255,255,255,.35);
  cursor:pointer; position:relative; overflow:hidden; transition:color .22s; -webkit-appearance:none;
}
#start-btn::before { content:''; position:absolute; inset:0; background:#fff; transform:translateX(-101%); transition:transform .22s; z-index:-1; }
#start-btn:active::before { transform:translateX(0); }
#start-btn:active { color:#000; }
#start-btn:disabled { opacity:.3; pointer-events:none; }

/* ERROR */
#err { display:none; position:fixed; inset:0; z-index:90; background:#080808;
  flex-direction:column; align-items:center; justify-content:center;
  gap:.7rem; padding:1.5rem; text-align:center; }
#err.on { display:flex; }
#err h2 { font-family:'Bebas Neue',cursive; font-size:1.7rem; color:rgba(255,255,255,.6); }
.ec { font-size:.65rem; color:rgba(200,200,200,.5); font-family:monospace; padding:.3rem .8rem; background:rgba(255,255,255,.04); border-radius:4px; max-width:90vw; word-break:break-all; }
.ecard { width:100%; max-width:400px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:1rem 1.2rem; text-align:left; }
.ecard h3 { font-size:.55rem; letter-spacing:.18em; color:rgba(255,255,255,.28); margin-bottom:.5rem; }
.ecard li { font-size:.72rem; color:rgba(255,255,255,.45); line-height:2.1; list-style:none; }
.ecard li::before { content:'→ '; color:rgba(255,255,255,.15); }
.ecard li strong { color:rgba(255,255,255,.85); }
.ebtns { display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; }
.ebtn { padding:.7rem 1.3rem; font-family:'Bebas Neue',cursive; font-size:.88rem; letter-spacing:.12em; border:1px solid rgba(255,255,255,.18); color:rgba(255,255,255,.45); background:transparent; cursor:pointer; border-radius:2px; -webkit-appearance:none; }
.ebtn.p { border-color:rgba(255,255,255,.4); color:rgba(255,255,255,.8); }

/* UI */
#ui { display:none; position:fixed; inset:0; z-index:20; pointer-events:none; }
#ui.on { display:block; }

/* 4분할 구분선 */
#grid {
  position:absolute; inset:0; pointer-events:none;
}
#grid::before {
  content:''; position:absolute;
  left:50%; top:0; bottom:0; width:1px;
  background:rgba(255,255,255,.12);
}
#grid::after {
  content:''; position:absolute;
  top:50%; left:0; right:0; height:1px;
  background:rgba(255,255,255,.12);
}

/* 각 셀 라벨 */
.clabel {
  position:absolute; font-family:'Bebas Neue',cursive;
  font-size:.55rem; letter-spacing:.25em; color:rgba(255,255,255,.2);
}
#lb0 { top:.8rem; left:.8rem; }
#lb1 { top:.8rem; right:.8rem; text-align:right; }
#lb2 { bottom:calc(.8rem + env(safe-area-inset-bottom,0px)); left:.8rem; }
#lb3 { bottom:calc(.8rem + env(safe-area-inset-bottom,0px)); right:.8rem; text-align:right; }

/* TOP */
#topbar {
  position:absolute; top:0; left:0; right:0;
  padding:max(.8rem,env(safe-area-inset-top,.8rem)) 1.2rem .5rem;
  display:flex; justify-content:space-between; align-items:center;
  background:linear-gradient(to bottom,rgba(0,0,0,.4),transparent);
  pointer-events:none;
}
.logo { font-family:'Bebas Neue',cursive; font-size:.88rem; letter-spacing:.18em; color:rgba(255,255,255,.3); }
</style>
</head>
<body>

<video id="vid" autoplay muted playsinline webkit-playsinline></video>
<canvas id="c"></canvas>

<!-- LANDING -->
<div id="landing">
  <h1>ART<br>FACE</h1>
  <p class="sub">네온 4분할 라이브</p>
  <button id="start-btn" onclick="startCam()">카메라 켜기 →</button>
</div>

<!-- ERROR -->
<div id="err">
  <h2 id="et">카메라 오류</h2>
  <div class="ec" id="ec"></div>
  <div class="ecard"><h3>해결 방법</h3><ul id="es"></ul></div>
  <div class="ebtns">
    <button class="ebtn p" onclick="retryBtn()">↩ 다시 시도</button>
    <button class="ebtn" onclick="copyUrl()">🔗 사파리로 열기</button>
  </div>
</div>

<!-- UI -->
<div id="ui">
  <div id="topbar">
    <span class="logo">ART FACE · NEON</span>
  </div>
  <div id="grid"></div>
  <!-- 각 셀 색상 이름 라벨 -->
  <span class="clabel" id="lb0"></span>
  <span class="clabel" id="lb1"></span>
  <span class="clabel" id="lb2"></span>
  <span class="clabel" id="lb3"></span>
</div>

<script>
// ── 에러 ───────────────────────────────────────────────
const EM = {
  NotAllowedError: { t:'카메라 권한 차단됨', s:['<strong>사파리(Safari)</strong>로 접속해 주세요','사파리 주소창 왼쪽 <strong>AA → 카메라 → 허용</strong>','설정 앱 → Safari → 카메라 → 허용'] },
  NotFoundError:   { t:'카메라를 찾을 수 없음', s:['카메라 권한 허용 확인','다른 앱 종료 후 재시도'] },
  NotReadableError:{ t:'카메라가 이미 사용 중', s:['모든 앱 종료 후 재시도','그래도 안 되면 폰 재시작'] },
  SecurityError:   { t:'인앱브라우저 불가', s:['카카오톡·인스타 말고 <strong>사파리</strong>로 접속','주소가 https:// 로 시작하는지 확인'] },
  TypeError:       { t:'카메라 API 미지원', s:['아래 "사파리로 열기" 버튼 → 사파리에서 다시 열기'] },
  TimeoutError:    { t:'카메라 응답 없음', s:['카카오톡 인앱브라우저는 카메라 차단','아래 "사파리로 열기" 버튼을 눌러주세요'] },
};
function showErr(e) {
  const n = e?.name || 'Error', inf = EM[n] || { t:'오류: '+n, s:['사파리로 새로 열기','페이지 새로고침'] };
  document.getElementById('et').textContent = inf.t;
  document.getElementById('ec').textContent = n + (e?.message ? ': '+e.message : '');
  document.getElementById('es').innerHTML = inf.s.map(s => `<li>${s}</li>`).join('');
  document.getElementById('landing').style.display = 'none';
  document.getElementById('err').classList.add('on');
}
function retryBtn() {
  document.getElementById('err').classList.remove('on');
  const l = document.getElementById('landing');
  l.style.cssText = 'display:flex;opacity:1';
  document.getElementById('start-btn').disabled = false;
  document.getElementById('start-btn').textContent = '카메라 켜기 →';
}
function copyUrl() {
  const url = location.href;
  navigator.clipboard?.writeText(url).then(() => alert('복사됨!\nSafari에서 붙여넣기 하세요.')).catch(() => prompt('주소 복사:', url)) || prompt('주소 복사:', url);
}

// ── 캔버스 & 비디오 ────────────────────────────────────
const c   = document.getElementById('c');
const ctx = c.getContext('2d');
const vid = document.getElementById('vid');
const vc  = document.createElement('canvas');
const vx  = vc.getContext('2d', { willReadFrequently:true });
// 네온 처리용 오프스크린 (단일 셀 크기)
const nc  = document.createElement('canvas');
const nx  = nc.getContext('2d');

let W, H, VW = 640, VH = 480, T = 0, running = false;
let curPx = null;

function resize() {
  W = c.width  = window.innerWidth;
  H = c.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── 카메라 시작 ────────────────────────────────────────
function camTimeout(cfg, ms) {
  return Promise.race([
    navigator.mediaDevices.getUserMedia(cfg),
    new Promise((_, rej) => setTimeout(() => rej({ name:'TimeoutError' }), ms))
  ]);
}

async function startCam() {
  const btn = document.getElementById('start-btn');
  btn.textContent = '연결 중...'; btn.disabled = true;

  if (!navigator.mediaDevices?.getUserMedia) {
    showErr({ name:'TypeError', message:'getUserMedia 없음. 사파리로 열어주세요.' }); return;
  }

  const tries = [
    { video:{ facingMode:'user', width:{ideal:640}, height:{ideal:480} } },
    { video:{ facingMode:'user' } },
    { video:true },
  ];
  let stream = null, lastErr = null;
  for (const cfg of tries) {
    try { stream = await camTimeout(cfg, 5000); break; }
    catch(e) { lastErr = e; if (['NotAllowedError','SecurityError','TypeError','TimeoutError'].includes(e.name)) break; }
  }
  if (!stream) { showErr(lastErr); return; }

  vid.srcObject = stream;
  try { await vid.play(); } catch(e) { showErr(e); return; }

  VW = vid.videoWidth  || 640;
  VH = vid.videoHeight || 480;
  vc.width = VW; vc.height = VH;

  const land = document.getElementById('landing');
  land.style.opacity = '0';
  setTimeout(() => land.style.display = 'none', 700);
  document.getElementById('ui').classList.add('on');
  if (!running) { running = true; requestAnimationFrame(loop); }
}

// ── 비디오 캡처 (미러 반전) ────────────────────────────
function capture() {
  if (vid.readyState < 2) return false;
  vx.save(); vx.translate(VW, 0); vx.scale(-1, 1);
  vx.drawImage(vid, 0, 0, VW, VH);
  vx.restore();
  curPx = vx.getImageData(0, 0, VW, VH).data;
  return true;
}

function sampleRGB(data, sx, sy) {
  const px = Math.max(0, Math.min(VW-1, Math.round(sx)));
  const py = Math.max(0, Math.min(VH-1, Math.round(sy)));
  const i  = (py * VW + px) * 4;
  return [data[i], data[i+1], data[i+2]];
}

// ── 네온 필터 (셀 하나 처리) ───────────────────────────
// hueShift: 기본 hue 오프셋 (색상 변화)
// bloom: 글로우 강도
// invert: 색 반전 여부
// tint: [r,g,b] 색조 믹스 비율 (0~1)
function renderNeonCell(destCtx, destX, destY, cellW, cellH, hueShift, bloomAlpha, tintR, tintG, tintB) {
  const src = curPx;
  const out = nx.createImageData(cellW, cellH);
  const d   = out.data;

  for (let y = 1; y < cellH - 1; y++) {
    for (let x = 1; x < cellW - 1; x++) {
      // 셀 좌표 → 비디오 좌표
      const vsx = (x / cellW) * VW;
      const vsy = (y / cellH) * VH;

      const [r,  g,  b ] = sampleRGB(src, vsx,       vsy);
      const [rL, gL, bL] = sampleRGB(src, vsx - VW/cellW, vsy);
      const [rR, gR, bR] = sampleRGB(src, vsx + VW/cellW, vsy);
      const [rU, gU, bU] = sampleRGB(src, vsx,       vsy - VH/cellH);
      const [rD, gD, bD] = sampleRGB(src, vsx,       vsy + VH/cellH);

      const gx   = Math.abs(rR-rL) + Math.abs(gR-gL) + Math.abs(bR-bL);
      const gy   = Math.abs(rD-rU) + Math.abs(gD-gU) + Math.abs(bD-bU);
      const edge = Math.min(255, (gx + gy) / 2);

      // hueShift 적용
      const hue = (r * 0.4 + T * 0.8 + hueShift) % 360;
      const neonR = edge * Math.max(0, Math.sin((hue +   0) * Math.PI / 180));
      const neonG = edge * Math.max(0, Math.sin((hue + 120) * Math.PI / 180));
      const neonB = edge * Math.max(0, Math.sin((hue + 240) * Math.PI / 180));

      const i = (y * cellW + x) * 4;
      // 어두운 배경 + 네온 엣지 + 색조 틴트
      d[i]   = Math.min(255, r * 0.07 + neonR * 2.6 + tintR * edge * 0.008);
      d[i+1] = Math.min(255, g * 0.07 + neonG * 2.6 + tintG * edge * 0.008);
      d[i+2] = Math.min(255, b * 0.10 + neonB * 2.6 + tintB * edge * 0.008);
      d[i+3] = 255;
    }
  }

  // 오프스크린에 그리기
  nc.width = cellW; nc.height = cellH;
  nx.putImageData(out, 0, 0);

  // 메인 캔버스에 붙이기
  destCtx.drawImage(nc, destX, destY, cellW, cellH);

  // 네온 글로우 블룸
  destCtx.save();
  destCtx.globalCompositeOperation = 'screen';
  destCtx.filter = 'blur(3px)';
  destCtx.globalAlpha = bloomAlpha * 0.55;
  destCtx.drawImage(nc, destX, destY, cellW, cellH);
  destCtx.filter = 'blur(9px)';
  destCtx.globalAlpha = bloomAlpha * 0.22;
  destCtx.drawImage(nc, destX, destY, cellW, cellH);
  destCtx.filter = 'none';
  destCtx.globalCompositeOperation = 'source-over';
  destCtx.restore();
}

// 4개 셀 설정
// hueShift, bloomAlpha, tintR, tintG, tintB, labelText
const CELLS = [
  [   0,  0.5, 255,  20,  80, '● CYAN'    ],   // 청록 (원본)
  [ 120,  0.6,  20, 255,  80, '● GREEN'   ],   // 초록
  [ 240,  0.6,  80,  20, 255, '● VIOLET'  ],   // 보라
  [  60,  0.55, 255, 180,  20, '● GOLDEN' ],   // 황금
];

function drawQuad() {
  if (!capture()) return;

  const hw = Math.floor(W / 2);
  const hh = Math.floor(H / 2);

  // 좌상, 우상, 좌하, 우하
  const positions = [
    [0,  0 ],
    [hw, 0 ],
    [0,  hh],
    [hw, hh],
  ];

  positions.forEach(([dx, dy], i) => {
    const [hueShift, bloom, tR, tG, tB, label] = CELLS[i];
    renderNeonCell(ctx, dx, dy, hw, hh, hueShift, bloom, tR, tG, tB);
  });

  // 분할선 (캔버스 위에 직접 그리기)
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth   = 1;
  ctx.beginPath(); ctx.moveTo(hw, 0); ctx.lineTo(hw, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, hh); ctx.lineTo(W, hh); ctx.stroke();
  ctx.restore();
}

// ── 라벨 업데이트 ─────────────────────────────────────
function updateLabels() {
  const hw = Math.floor(W / 2);
  const hh = Math.floor(H / 2);
  const labels = [
    { id:'lb0', text: CELLS[0][5], style: `top:.9rem; left:.8rem;` },
    { id:'lb1', text: CELLS[1][5], style: `top:.9rem; right:.8rem; text-align:right;` },
    { id:'lb2', text: CELLS[2][5], style: `bottom:calc(.9rem + env(safe-area-inset-bottom,0px)); left:.8rem;` },
    { id:'lb3', text: CELLS[3][5], style: `bottom:calc(.9rem + env(safe-area-inset-bottom,0px)); right:.8rem; text-align:right;` },
  ];
  labels.forEach(l => {
    const el = document.getElementById(l.id);
    if (el) { el.textContent = l.text; el.style.cssText = l.style; }
  });
}

// ── LOOP ──────────────────────────────────────────────
function loop() {
  T++;
  drawQuad();
  requestAnimationFrame(loop);
}

// 라벨은 한번만
window.addEventListener('load', updateLabels);
</script>
</body>
</html>
